[project]
name = "agent-gateway-iam-demo"
version = "0.1.0"
description = "Google Cloud Agent Platform: Agent Gateway & Agent Identity Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.9.0,<3.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "a2a-sdk[http-server]~=0.3.22",
    "fastapi>=0.115.0",
    "google-auth>=2.30.0",
    "google-genai>=2.0.0",
    "httpx>=0.28.1",
    "mcp>=1.2.0",
    "pydantic>=2.10.0",
    "rich>=13.0.0",
    "uvicorn>=0.34.0",
    "certifi>=2024.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
